name: Deploy Marsa Moments to GitHub Pages

# Publishes the static site to GitHub Pages on every push to the
# development branch (or the default branch), and can be run on demand.
on:
  push:
    branches:
      - claude/marsa-moments-website-y3mf5y
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Regenerate tour pages, sitemap.xml and robots.txt from the data
      # source so the deployed site is always in sync with data.js.
      - name: Build static pages
        run: node scripts/build.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
